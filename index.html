
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HampusOS Terminal</title>
    <style>
        body {
            background-color: black;
            color: lime;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        #loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: center;
            text-align: center;
        }

        #progress-bar {
            width: 80%;
            height: 30px;
            border: 2px solid lime;
            margin-top: 20px;
            position: relative;
        }

        #progress {
            height: 100%;
            width: 0;
            background-color: lime;
        }

        #percentage {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 5px;
            color: white;
            font-weight: bold;
        }

        #terminal {
            display: none;
            width: 100%;
            height: 100%;
            background-color: black;
            border: 20px solid lime;
            padding: 20px;
            overflow-y: scroll;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: lime;
        }

        #terminal::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        #terminal {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .cursor {
            display: inline-block;
            background-color: lime;
            width: 10px;
            height: 20px;
            margin-left: 2px;
            animation: blink 0.8s steps(2, start) infinite;
        }

        @keyframes blink {
            from {
                visibility: visible;
            }
            to {
                visibility: hidden;
            }
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <p id="loading-text">Loading HampusOS Terminal...</p>
        <div id="progress-bar">
            <div id="progress"></div>
            <div id="percentage">0%</div>
        </div>
    </div>

    <div id="terminal"></div>

    <script>
        const terminal = document.getElementById('terminal');
        const progressBar = document.getElementById('progress');
        const percentageText = document.getElementById('percentage');
        const loadingText = document.getElementById('loading-text');
        const loadingScreen = document.getElementById('loading-screen');

        const text = `
Welcome to:
.██..██...████...██...██..█████...██..██...████....████....████..
.██..██..██..██..███.███..██..██..██..██..██......██..██..██.....
.██████..██████..██.█.██..█████...██..██...████...██..██...████..
.██..██..██..██..██...██..██......██..██......██..██..██......██.
.██..██..██..██..██...██..██.......████....████....████....████..
=================================================================

Initializing Journal Entry...
-----------------------------
Dear reader of this terminal.
If you stumbled upon this terminal...
I politely ask you to leave now!
-----------------------------
If you are one of my ex's!
Okay this has to be said to clear things up!
Basically I know I sh*t on all of my ex's and how terrible they are. 
But truly they are not, sure maybe we didn't work out in the end...
But that doesn't mean that they are terrible people. 
And I want them to know that I never hate them. 
I might act like I do and say that I do but I know that my heart feels different. 
They have giving me a lot of experience.
They have all shaped me to the person I am. 
And without them I wouldn't be the person I am today. 
And to all of those ex's I have hurt.
I am truly sorry, not that I just hurt you, I'm sorry it didn't work out between us. 
I just want to let you guys know that mostly the problem was me.
But if you still want to hate me forever I can understand. 
But at least I want to let you know, I know I'm a dickhead.
So from me to you I just want to say: 
I'm so sorry I've hurt you guys.
Sorry for any pain I've brought you.
-----------------------
EXTENDED WORDS FROM ME!
[2025 March 29th] (Saturday)
-----------------------
I never tought I'd end like this...
I'd like to at least be friends with most of you.
Though I understand not all of you can forgive me.
Some moved on, never wanting to see me again.
Some of you became a worse mess when we went apart.
Some of you bloomed due to our partings.
Do I miss my exs?
Yes, of course I do, they gave me so many good memories.
I have 99.9% of all memories we made in VRChat still intact.
[𝗨𝗡𝗗𝗘𝗥 𝗖𝗢𝗡𝗦𝗧𝗥𝗨𝗖𝗧𝗜𝗢𝗡!]
--------------
System Report:
--------------
[WARNING] Reality Check Failed! 
[ERROR] Friendship.exe couldn't be found! 
[SHUTDWON REASON] LIFE.exe IS CORRUPTED!

End of Report.
`;

        const flavorTexts = [
            "THIS WILL TAKE EXACTLY ONE MINUTE!",
            "Please don't tap the screen!",
            "Hope you're patient... this is going slow!",
            "Remember dial-up? Good times!",
            "Don't worry, you're almost there!",
            "Good things come to those who wait.",
            "Is it me or is this bar stuck?",
            "Just a bit longer... probably.",
            "Hang tight! Something awesome is coming.",
            "You look stupid reading these flavor texts!"
        ];

        let index = 0;

        function typeText() {
            if (index < text.length) {
                terminal.innerHTML += text.charAt(index);
                index++;
                setTimeout(typeText, 20);
            } else {
                const cursor = document.createElement('span');
                cursor.classList.add('cursor');
                terminal.appendChild(cursor);
            }
        }

        function simulateLoading() {
            let progress = 0;
            let flavorIndex = 0;

            const loadingInterval = setInterval(() => {
                progress += 1;
                progressBar.style.width = progress + '%';
                percentageText.textContent = progress + '%';

                if (progress % 10 === 0 && flavorIndex < flavorTexts.length) {
                    loadingText.textContent = flavorTexts[flavorIndex];
                    flavorIndex++;
                }

                if (progress >= 100) {
                    clearInterval(loadingInterval);
                    loadingScreen.style.display = 'none';
                    terminal.style.display = 'block';
                    typeText();
                }
            }, 10);
        }

        simulateLoading();
    </script>
</body>
</html>
