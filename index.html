<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HampusOS Terminal</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      color: lime;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
      overflow: hidden;
    }

    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      text-align: center;
      position: absolute;
      top: 0;
      left: 0;
    }

    #progress-bar {
      width: 80%;
      height: 30px;
      border: 2px solid lime;
      margin-top: 20px;
      position: relative;
    }

    #progress {
      height: 100%;
      width: 0%;
      background-color: lime;
    }

    #percentage {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 5px;
      color: white;
      font-weight: bold;
    }

    #terminal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: 5px solid lime;
      padding: 20px;
      background-color: black;
      color: lime;
      overflow: hidden;
      white-space: pre-wrap;
      word-wrap: break-word;
      display: flex;
      flex-direction: column;
      justify-content: start;
    }

    .cursor {
      display: inline-block;
      background-color: lime;
      width: 10px;
      height: 20px;
      margin-left: 2px;
      animation: blink 0.8s steps(2, start) infinite;
    }

    @keyframes blink {
      0% { visibility: visible; }
      100% { visibility: hidden; }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <p id="loading-text">Loading HampusOS Terminal...</p>
    <div id="progress-bar">
      <div id="progress"></div>
      <div id="percentage">0%</div>
    </div>
  </div>

  <div id="terminal"></div>

  <script>
    const terminal = document.getElementById('terminal');
    const progressBar = document.getElementById('progress');
    const percentageText = document.getElementById('percentage');
    const loadingText = document.getElementById('loading-text');
    const loadingScreen = document.getElementById('loading-screen');

    const text = `Welcome to:
oooooooooo.   oooooooooo.     .oooooo.    .oooooo..o 
\`888'   \`Y8b  \`888'   \`Y8b   d8P'  \`Y8b  d8P'    \`Y8 
 888     888   888      888 888      888 Y88bo.      
 888oooo888'   888      888 888      888  \`"Y8888o.  
 888    \`88b   888      888 888      888      \`"Y88b 
 888    .88P   888     d88' \`88b    d88' oo     .d8P 
o888bood8P'   o888bood8P'    \`Y8bood8P'  8""88888P'  
=================================================================

Initializing Journal Entry...
-----------------------------
Dear reader of this terminal.
If you stumbled upon this terminal...
I politely ask you to leave now!
...
[𝗨𝗡𝗗𝗘𝗥 𝗖𝗢𝗡𝗦𝗧𝗥𝗨𝗖𝗧𝗜𝗢𝗡!]
--------------
System Report:
--------------
[WARNING] Reality Check Failed! 
[ERROR] Friendship.exe couldn't be found! 
[SHUTDWON REASON] LIFE.exe IS CORRUPTED!

End of Report.
`;

    const flavorTexts = [
      "THIS WILL TAKE EXACTLY ONE MINUTE!",
      "Please don't tap the screen!",
      "Hope you're patient... this is going slow!",
      "Remember dial-up? Good times!",
      "Don't worry, you're almost there!",
      "Good things come to those who wait.",
      "Is it me or is this bar stuck?",
      "Just a bit longer... probably.",
      "Hang tight! Something awesome is coming.",
      "You look silly reading these flavor texts!"
    ];

    let index = 0;

    function typeText() {
      if (index < text.length) {
        terminal.innerHTML += text.charAt(index);
        index++;
        setTimeout(typeText, 20);
      } else {
        const cursor = document.createElement('span');
        cursor.classList.add('cursor');
        terminal.appendChild(cursor);
      }
    }

    function simulateLoading() {
      let progress = 0;
      let flavorIndex = 0;

      const loadingInterval = setInterval(() => {
        progress += 1;
        progressBar.style.width = progress + '%';
        percentageText.textContent = progress + '%';

        if (progress % 10 === 0 && flavorIndex < flavorTexts.length) {
          loadingText.textContent = flavorTexts[flavorIndex];
          flavorIndex++;
        }

        if (progress >= 100) {
          clearInterval(loadingInterval);
          loadingScreen.style.display = 'none';
          terminal.style.display = 'flex';
          typeText();
        }
      }, 600);
    }

    simulateLoading();
  </script>
</body>
</html>
